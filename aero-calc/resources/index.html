<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>aero calc</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div class="calculator">
    <canvas id="confetti"></canvas>
    <div class="display" id="display"></div>
    <div class="keys">
      <button class="bubble" data-key="c" id="C">C</button>
      <button class="bubble" data-key="Backspace" id="←">←</button>
      <button class="bubble func" data-key="%" id="%">%</button>
      <button class="bubble func" data-key="/" id="/">÷</button>
      <button class="bubble num" data-key="7" id="7">7</button>
      <button class="bubble num" data-key="8" id="8">8</button>
      <button class="bubble num" data-key="9" id="9">9</button>
      <button class="bubble func" data-key="*" id="*">x</button>
      <button class="bubble num" data-key="4" id="4">4</button>
      <button class="bubble num" data-key="5" id="5">5</button>
      <button class="bubble num" data-key="6" id="6">6</button>
      <button class="bubble num" data-key="-" id="-">-</button>
      <button class="bubble num" data-key="1" id="1">1</button>
      <button class="bubble num" data-key="2" id="2">2</button>
      <button class="bubble num" data-key="3" id="3">3</button>
      <button class="bubble func" data-key="+" id="+">+</button>
      <button class="bubble" id="effect"></button>
      <button class="bubble num" data-key="0" id="0">0</button>
      <button class="bubble" data-key="." id=".">.</button>
      <button class="bubble" data-key="Enter" id="=">=</button>
    </div>
  </div>
  <script src="/js/neutralino.js"></script>
  <script src="/js/main.js"></script>
  <script src="script.js"></script>
</body>

</html>
