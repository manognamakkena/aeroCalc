<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Neutralinojs sample app</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div class="calculator">
    <div class="display"></div>
    <div class="keys">
      <button class="bubble" class="3xl bold underline" id="C">C</button>
      <button class="bubble" id="AC">AC</button>
      <button class="bubble" id="%">%</button>
      <button class="bubble" id="÷">/</button>
      <button class="bubble" id="7">7</button>
      <button class="bubble" id="8">8</button>
      <button class="bubble" id="9">9</button>
      <button class="bubble" id="*">x</button>
      <button class="bubble" id="4">4</button>
      <button class="bubble" id="5">5</button>
      <button class="bubble" id="6">6</button>
      <button class="bubble" id="-">-</button>
      <button class="bubble" id="1">1</button>
      <button class="bubble" id="2">2</button>
      <button class="bubble" id="3">3</button>
      <button class="bubble" id="+">+</button>
      <button class="bubble" id="0">0</button>
      <button class="bubble" id=".">.</button>
      <button class="bubble" id="equals">=</button>
    </div>
  </div>
  <script src="/js/neutralino.js"></script>
  <script src="/js/main.js"></script>
  <script src="/aero-calc/resources/script.js"></script>
</body>

</html>
