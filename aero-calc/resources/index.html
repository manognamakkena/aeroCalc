<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Neutralinojs sample app</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div class="calculator">
    <div class="display" id="display"></div>
    <div class="keys">
      <button class="bubble" class="3xl bold underline" id="C">C</button>
      <button class="bubble" id="←">←</button>
      <button class="bubble func" id="%">%</button>
      <button class="bubble func" id="/">÷</button>
      <button class="bubble num" id="7">7</button>
      <button class="bubble num" id="8">8</button>
      <button class="bubble num" id="9">9</button>
      <button class="bubble func" id="*">x</button>
      <button class="bubble num" id="4">4</button>
      <button class="bubble num" id="5">5</button>
      <button class="bubble num" id="6">6</button>
      <button class="bubble num" id="-">-</button>
      <button class="bubble num" id="1">1</button>
      <button class="bubble num" id="2">2</button>
      <button class="bubble num" id="3">3</button>
      <button class="bubble func" id="+">+</button>
      <button class="bubble"></button>
      <button class="bubble num" id="0">0</button>
      <button class="bubble" id=".">.</button>
      <button class="bubble" id="=">=</button>
    </div>
  </div>
  <script src="/js/neutralino.js"></script>
  <script src="/js/main.js"></script>
  <script src="script.js"></script>
</body>

</html>
